server.port=${PORT:8080}
spring.application.name=cli-task-chat

# Path to the crawler CLI jar the backend runs as a separate process.
crawler.jar=${CRAWLER_JAR:../crawler-cli/target/sitecrawl.jar}
# Hard limit for one CLI run; the process is killed after this.
crawler.process-timeout-seconds=${CRAWLER_PROCESS_TIMEOUT:75}
# Most CLI runs allowed at the same time.
crawler.max-concurrent=${CRAWLER_MAX_CONCURRENT:2}

# Optional. Without a key the app uses its rule-based intent parser and an extractive summary.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
